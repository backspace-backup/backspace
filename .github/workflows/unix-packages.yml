name: Linux and macOS packages

# The Linux and macOS downloads of each release (U245), built by
# scripts/package-unix.sh. Called by the release workflow; can also be run
# alone to check the packages without publishing anything.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version embedded in the program, e.g. 1.1.42 (a leading v is dropped)'
        type: string
        default: '0.0.1'
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: linux-x64,   os: ubuntu-latest, run: true }
          - { rid: linux-arm64, os: ubuntu-latest, run: false }
          - { rid: osx-arm64,   os: macos-latest,  run: true }
          - { rid: osx-x64,     os: macos-latest,  run: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Tools the engine download needs
        if: runner.os == 'Linux'
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)
      - name: Build the package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          v="${{ inputs.version }}"
          bash scripts/package-unix.sh "${{ matrix.rid }}" "${v#v}" packages
      - name: The program starts and reports its version
        if: ${{ matrix.run }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          case "${{ matrix.rid }}" in
            linux-*) tar -C "$dir" -xzf packages/Backspace-*.tar.gz; exe="$dir/Backspace" ;;
            osx-*)   ditto -x -k packages/Backspace-*.zip "$dir"; exe="$dir/Backspace.app/Contents/MacOS/Backspace"; codesign --verify --deep --strict "$dir/Backspace.app" ;;
          esac
          out="$("$exe" --version 2>&1 || true)"
          echo "$out"
          v="${{ inputs.version }}"
          echo "$out" | grep -F "Backspace ${v#v}"
          # Opened like a user would: the window starts and stays up, and the
          # settings folder appears beside the program (beside Backspace.app
          # on macOS, never inside it). restic and rclone are downloaded at
          # the first backup; EngineInstallationTests downloads and checks them.
          case "${{ matrix.rid }}" in
            linux-*) sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq xvfb >/dev/null; (xvfb-run -a "$exe" > "$dir/run.log" 2>&1 &) ;;
            osx-*)   open "$dir/Backspace.app" ;;
          esac
          sleep 25
          ls -la "$dir"
          running=0; pgrep -f "$exe" >/dev/null && running=1
          pkill -f "$exe" || true
          cat "$dir/run.log" 2>/dev/null | tail -20 || true
          [ "$running" = 1 ] || { echo "Backspace did not stay open"; exit 1; }
          test -d "$dir/Backspace.config" || { echo "No settings folder beside the app"; exit 1; }
          test ! -e "$dir/Backspace.app/Contents/MacOS/Backspace.config"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: packages/
          if-no-files-found: error
