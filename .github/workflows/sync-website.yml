name: Sync website to backspace-backup.github.io

# Mirrors the contents of docs/ into the backspace-backup/backspace-backup.github.io repo
# every time main changes. The website repo is a "user/org Pages" repo, so
# GitHub Pages serves its root at https://backspace-backup.github.io/ — that's why
# we copy the docs/ folder INTO that repo's root rather than keeping the
# /docs/ path segment.
#
# ──────────────────────────────────────────────────────────────────────────
# One-time setup: a fine-grained personal access token limited to the website
# repository (Contents: read and write), stored here as the WEBSITE_DEPLOY_TOKEN
# secret. Deploy keys are disabled for the backspace-backup organization.
# Until the secret exists this workflow fails at the deploy step. Steps in
# docs/RELEASING.md, "Website".
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/sync-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repo
        uses: actions/checkout@v4

      - name: Prepare website bundle
        run: |
          cp -r docs _site

      - name: Inject analytics script
        if: vars.TIDESIGHT_URL != '' && vars.TIDESIGHT_SITE_ID != ''
        env:
          ANALYTICS_URL: ${{ vars.TIDESIGHT_URL }}
          ANALYTICS_SITE: ${{ vars.TIDESIGHT_SITE_ID }}
          ANALYTICS_ROOT: _site
        run: |
          python3 - <<'PY'
          # Tags every HTML page published from ANALYTICS_ROOT. A page without </head>
          # fails the deploy instead of going out untracked; a small redirect page is
          # left alone (the page it leads to is counted).
          import os, pathlib, re, sys
          url, site = os.environ["ANALYTICS_URL"], os.environ["ANALYTICS_SITE"]
          root = pathlib.Path(os.environ["ANALYTICS_ROOT"])
          tag = f'  <script async src="{url}" data-site="{site}"></script>\n'
          redirect = re.compile(r"""http-equiv=["']?refresh|location\.replace\(""", re.I)
          tagged, redirects, missing = [], [], []
          for p in sorted(root.rglob("*.html")):
              rel = p.relative_to(root)
              if any(part.startswith(".") or part == "node_modules" for part in rel.parts):
                  continue
              html = p.read_text(encoding="utf-8")
              if url in html:
                  tagged.append(rel.as_posix())
                  continue
              if redirect.search(html) and len(html) < 4000:
                  redirects.append(rel.as_posix())
                  continue
              head = re.search(r"</head\s*>", html, re.I)
              if not head:
                  missing.append(rel.as_posix())
                  continue
              p.write_text(html[:head.start()] + tag + html[head.start():], encoding="utf-8")
              tagged.append(rel.as_posix())
          print("Tagged:", *tagged, sep="\n  ")
          if redirects:
              print("Redirect pages, not tagged:", *redirects, sep="\n  ")
          if missing:
              print("::error::No </head> to tag in: " + ", ".join(missing))
              sys.exit(1)
          if not tagged:
              print("::error::No page was tagged under " + str(root))
              sys.exit(1)
          PY

      - name: Mirror docs/ to backspace-backup.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          external_repository: backspace-backup/backspace-backup.github.io
          publish_branch: main
          publish_dir: ./_site
          # Force-push so the website repo's history mirrors docs/ exactly
          # rather than accumulating noisy merge commits. The website repo
          # is treated as a build artifact, not a working tree.
          force_orphan: true
          user_name: 'backspace-bot'
          user_email: 'bot@users.noreply.github.com'
          commit_message: 'Sync from backspace-backup/backspace@${{ github.sha }}'
