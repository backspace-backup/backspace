name: Sync website to backspace-backup.github.io

# Mirrors the contents of docs/ into the backspace-backup/backspace-backup.github.io repo
# every time main changes. The website repo is a "user/org Pages" repo, so
# GitHub Pages serves its root at https://backspace-backup.github.io/ — that's why
# we copy the docs/ folder INTO that repo's root rather than keeping the
# /docs/ path segment.
#
# ──────────────────────────────────────────────────────────────────────────
# One-time setup: a deploy key with write access to the website repository,
# stored here as the WEBSITE_DEPLOY_KEY secret (it never expires and reaches
# no other repository). Until it exists this workflow fails at the deploy step.
# Commands in docs/RELEASING.md, "Website".
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/sync-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repo
        uses: actions/checkout@v4

      - name: Mirror docs/ to backspace-backup.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          external_repository: backspace-backup/backspace-backup.github.io
          publish_branch: main
          publish_dir: ./docs
          # Force-push so the website repo's history mirrors docs/ exactly
          # rather than accumulating noisy merge commits. The website repo
          # is treated as a build artifact, not a working tree.
          force_orphan: true
          user_name: 'backspace-bot'
          user_email: 'bot@users.noreply.github.com'
          commit_message: 'Sync from backspace-backup/backspace@${{ github.sha }}'
