name: Cross-platform tests

# The whole test suite on Linux and macOS (U235), to say truthfully in the
# README how well Backspace works there. Windows-only tests (the background
# service, WinFsp mounting, Credential Manager, Task Scheduler, shadow copies)
# are left out of that build; the test project lists them. Cloud tests read
# their tokens from the repository's encrypted secrets (U244), written to the
# Git-excluded secrets.env for this run only; without them they skip and say so.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tools the engine download needs
        if: runner.os == 'Linux'
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Build the tests (fetches this platform's restic and rclone)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet build tests/Backspace.Tests --nologo

      - name: Cloud test tokens (encrypted secrets, this run only)
        shell: bash
        env:
          DROPBOX_TEST_TOKEN: ${{ secrets.DROPBOX_TEST_TOKEN }}
          ONEDRIVE_TEST_TOKEN: ${{ secrets.ONEDRIVE_TEST_TOKEN }}
          GOOGLEDRIVE_TEST_TOKEN: ${{ secrets.GOOGLEDRIVE_TEST_TOKEN }}
        run: |
          f=tests/Backspace.Tests/secrets.env
          : > "$f"; chmod 600 "$f"
          folder="backspace-ci/${{ github.run_id }}-${{ matrix.os }}"
          for p in DROPBOX ONEDRIVE GOOGLEDRIVE; do
            v="${p}_TEST_TOKEN"
            if [ -n "${!v}" ]; then
              { echo "$v=${!v}"; echo "${p}_TEST_FOLDER=$folder"; } >> "$f"
              echo "$p: token present"
            else
              echo "$p: no token, its tests skip"
            fi
          done

      - name: Run the tests
        env:
          BACKSPACE_E2E_NONINTERACTIVE: '1'
        run: >
          dotnet test tests/Backspace.Tests --no-build --nologo
          --logger "trx;LogFileName=results.trx"
          --logger "console;verbosity=normal"
          --results-directory test-results
        continue-on-error: true

      - name: Summary
        if: always()
        shell: bash
        run: |
          f=$(find test-results -name results.trx | head -1)
          if [ -z "$f" ]; then echo "No results." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          python3 - "$f" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          root = ET.parse(sys.argv[1]).getroot()
          c = root.find('.//t:Counters', ns).attrib
          print(f"### {c.get('total')} tests: {c.get('passed')} passed, {c.get('failed')} failed, {int(c.get('total')) - int(c.get('executed'))} not run\n")
          failed = [r.attrib['testName'] for r in root.findall('.//t:UnitTestResult', ns) if r.attrib.get('outcome') == 'Failed']
          for name in sorted(failed): print(f"- {name}")
          PY

      - name: Remove the tokens file
        if: always()
        shell: bash
        run: rm -f tests/Backspace.Tests/secrets.env

      - name: Keep the results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: |
            test-results
            tests/Backspace.Tests/artifacts/scenarios
          retention-days: 14
