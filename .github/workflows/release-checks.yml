name: Release checks

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after human approval (false exercises the gate without creating a release)'
        type: boolean
        default: false
      tag:
        description: 'New release tag, e.g. v1.0.0 (required only when publishing)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release-checks:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release request
        shell: pwsh
        env:
          PUBLISH: ${{ inputs.publish }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if ($env:PUBLISH -eq 'true') {
            if ($env:SOURCE_REF -ne 'refs/heads/main') { throw 'Publishing is allowed only from main.' }
            if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') { throw 'A valid new version tag is required.' }
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run unit and interface checks
        shell: pwsh
        run: |
          dotnet test tests/Backspace.Tests -m:1 -p:SkipStubBuild=true --filter "FullyQualifiedName!~E2E" --logger "trx;LogFileName=interface.trx" --results-directory release-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Back up and restore 20,000 files and 2 GiB with the real engine
        shell: pwsh
        env:
          BACKSPACE_E2E_SCALE: huge
        run: |
          dotnet test tests/Backspace.Tests --no-build --filter "FullyQualifiedName~E34_RestoreLongIncludeList" --logger "trx;LogFileName=large-round-trip.trx" --results-directory release-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$result = [System.IO.File]::ReadAllText((Join-Path $PWD 'release-evidence/large-round-trip.trx'), [System.Text.UTF8Encoding]::new($false))
          $counts = $result.TestRun.ResultSummary.Counters
          if ([int]$counts.passed -ne 1 -or [int]$counts.total -ne 1) { throw 'The large round-trip test must run and pass; an empty or skipped run is not sufficient.' }
          # Scenario-level skips can be successful xUnit returns. Require the
          # scenario report and the actual 20,000-file comparison as well.
          $summary = [System.IO.File]::ReadAllText((Join-Path $PWD 'tests/Backspace.Tests/artifacts/scenarios/SUMMARY.md'), [System.Text.UTF8Encoding]::new($false))
          if ($summary -notmatch '(?m)^### E34-restore-long-include-list — ✓ STEPS COMPLETED ') { throw 'The real-engine scenario did not complete its steps.' }
          $validation = [System.IO.File]::ReadAllText((Join-Path $PWD 'tests/Backspace.Tests/artifacts/scenarios/E34-restore-long-include-list/restore-validation.md'), [System.Text.UTF8Encoding]::new($false))
          if ($validation -notmatch 'Full SHA-256 comparison of 20000 files: all match\.') { throw 'The large run did not verify all 20,000 restored files.' }
      - name: Record the exact revision for the human documentation review
        shell: pwsh
        run: |
          git rev-parse HEAD | Out-File release-evidence/commit.txt -Encoding utf8
          Copy-Item docs/RELEASING.md release-evidence/RELEASING.md
          Copy-Item README.md, DESIGN.md release-evidence/
          Copy-Item docs release-evidence/docs -Recurse
          "## Release review`nReview the test records, screenshots and documentation in release-evidence-${{ github.sha }} before approving. Revision: ${{ github.sha }}. Publish requested: ${{ inputs.publish }}." | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Build the Windows release candidate
        shell: pwsh
        run: |
          dotnet publish src/Backspace -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true -m:1 -o release-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path release-candidate/* -DestinationPath release-evidence/Backspace-windows-x64.zip
          Get-FileHash release-evidence/Backspace-windows-x64.zip -Algorithm SHA256 | Format-List | Out-File release-evidence/SHA256.txt -Encoding utf8
      - name: Save results and freshly rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            release-evidence/
            tests/Backspace.Tests/artifacts/scenarios/
          if-no-files-found: error

  approve-and-publish:
    name: Human review before publishing
    needs: windows-release-checks
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: reviewed-evidence
      - name: Gate rehearsal completed
        if: ${{ !inputs.publish }}
        run: echo 'Human approval was required. This rehearsal creates no tag or release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the reviewed candidate
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n\357\273\277' < reviewed-evidence/release-evidence/commit.txt)" = "$RELEASE_SHA"
          # Existing tags/releases must never be silently retargeted or replaced.
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Tag already exists; choose a new release version.' >&2; exit 1
          fi
          gh release create "$RELEASE_TAG" reviewed-evidence/release-evidence/Backspace-windows-x64.zip reviewed-evidence/release-evidence/SHA256.txt --target "$RELEASE_SHA" --title "Backspace $RELEASE_TAG" --generate-notes
